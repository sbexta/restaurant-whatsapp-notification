services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: whatsapp_order_notification
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-evolution-db.sh:/docker-entrypoint-initdb.d/init-evolution-db.sh:ro

  backend:
    build:
      context: ../backend/WhatsAppOrderNotification.Api
    container_name: backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=whatsapp_order_notification;Username=postgres;Password=${POSTGRES_PASSWORD}"
      N8n__WebhookUrl: "http://n8n:5678/webhook/customer-ready"
      N8n__WebhookSecret: ${N8N_WEBHOOK_SECRET}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN}
    depends_on:
      - postgres

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: ${VM_HOST}
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      WEBHOOK_URL: "http://${VM_HOST}:5678/"
      GENERIC_TIMEZONE: America/Bogota
    volumes:
      - n8n_data:/home/node/.n8n

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "${EVOLUTION_PORT:-8080}:8080"
    environment:
      SERVER_URL: "http://${VM_HOST}:${EVOLUTION_PORT:-8080}"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=evolution_api&connect_timeout=30&pool_timeout=30"
      CACHE_REDIS_ENABLED: "false"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - postgres

volumes:
  postgres_data:
  n8n_data:
  evolution_instances:
